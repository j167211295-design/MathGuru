
name: MathGuru Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Install Capacitor
        working-directory: android
        run: npm ci

      - name: Verify Capacitor
        run: |
          test -f android/node_modules/@capacitor/android/capacitor/build.gradle
          echo "Capacitor Android module OK"

      - name: Decode release keystore
        run: |
           printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/android/mathguru-release.jks
          

      - name: Build Release AAB
        working-directory: android/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MathGuru-release-aab
          path: android/android/app/build/outputs/bundle/release/*.aab
